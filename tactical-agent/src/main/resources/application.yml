spring:
  application:
    name: tactical-agent
  profiles:
    default: dev
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:tm_broker}
    password: ${RABBITMQ_PASSWORD}
    listener:
      simple:
        auto-startup: ${BROKER_LISTENER_AUTO_START:false}

server:
  port: ${SERVER_PORT:8083}

app:
  mcp:
    base-url: ${MCP_SERVER_BASE_URL:http://localhost:8082}

---
spring:
  config:
    activate:
      on-profile: docker
  rabbitmq:
    listener:
      simple:
        auto-startup: true
